<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    
</head>
<body>
     <header class="Titulo"><h1>Formulário para contato</h1></header>
     <main>
         <fieldset>
         Nome completo<br>
         <input type="text" name="Nome" id="Nome">
         <label for="Nome" id="Nome"></label><br>
         Email<br>
         <input type="email" name="email" id="email" placeholder="Exemplo@gmail.com">
         <label for="email" id="email"></label><br>
         CPF<br>
         <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00">
         <label for="cpf" id="cpf"></label><br>
         Número para contato<br>
         <select>
            <option>+55</option>
            <option>+67</option>
            <option>+44</option>
            <option>+22</option>
            <option>+72</option>
         </select>
         <input type="text" name="fone" id="fone" placeholder="(00)90000-0000">
         <label for="fone" id="fone"></label><br>
         <fieldset>
             <legend>
                Preferência de trabalho
             </legend>
             <ul>
                <li>CSS</li>
                <li>HTML</li>
                <li>JS</li>
                <li>C++</li>
                <li>Python</li>
             </ul>
             </fieldset>
             </fieldset>
             <div class="button">
                <input type="submit" name="botao" id="botao" placeholder="Enviar">
                <label for="botao" id="botao"></label>
             </div>
               


            </fieldset>
    </main>

</body>
</html>
